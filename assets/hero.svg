<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">microconf, ordered sources in and typed config out</title>
  <desc id="desc">A technical diagram showing APP_PORT flowing through a microtype number schema into a typed configuration object, with defaults used only for missing values and invalid values producing an error.</desc>

  <rect width="1200" height="420" rx="24" fill="#10110F"/>
  <rect x="1" y="1" width="1198" height="418" rx="23" fill="none" stroke="#343830" stroke-width="2"/>

  <g id="identity" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="60" y="66" fill="#8D9288" font-size="18" font-weight="600" letter-spacing="3">TYPE-SAFE CONFIGURATION / TYPESCRIPT</text>
    <text x="56" y="172" fill="#F3F0E8" font-size="88" font-weight="750" letter-spacing="-4">micro</text>
    <text x="274" y="172" fill="#B7E46C" font-size="88" font-weight="750" letter-spacing="-4">conf</text>

    <text x="60" y="226" fill="#F3F0E8" font-size="30" font-weight="550">Ordered sources in.</text>
    <text x="60" y="264" fill="#F3F0E8" font-size="30" font-weight="550">Typed config out.</text>

    <path d="M60 316H514" stroke="#343830" stroke-width="2"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#8D9288">
      <text x="100" y="354" text-anchor="end">ESM</text>
      <rect x="116" y="345" width="4" height="4" fill="#B7E46C"/>
      <text x="136" y="354">MICROTYPE</text>
    </g>
  </g>

  <path d="M590 48V372" stroke="#343830" stroke-width="2"/>

  <g id="config-resolution" transform="translate(640 42)">
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="0" y="24" fill="#8D9288" font-size="18" font-weight="600" letter-spacing="2.4">CONFIG RESOLUTION</text>

      <g id="environment-source" transform="translate(0 48)">
        <rect width="500" height="66" rx="14" fill="#171916" stroke="#3A3E36" stroke-width="2"/>
        <rect x="0" y="0" width="8" height="66" rx="4" fill="#E7B75D"/>
        <text x="28" y="27" fill="#8D9288" font-size="17">SOURCE 01 / ENV</text>
        <text x="28" y="52" fill="#F3F0E8" font-size="22" font-weight="650">APP_PORT</text>
        <text x="466" y="44" text-anchor="end" fill="#E7B75D" font-size="22">3000</text>
      </g>

      <path d="M250 114V137" stroke="#596052" stroke-width="2"/>
      <path d="M244 131L250 137L256 131" fill="none" stroke="#596052" stroke-width="2"/>

      <g id="schema" transform="translate(0 138)">
        <rect width="500" height="78" rx="14" fill="#171916" stroke="#3A3E36" stroke-width="2"/>
        <text x="28" y="28" fill="#8D9288" font-size="17">SCHEMA / MICROTYPE</text>
        <text x="28" y="57" fill="#F3F0E8" font-size="22">
          <tspan fill="#B7E46C">t</tspan><tspan>.number().default(8080)</tspan>
        </text>
      </g>

      <path d="M250 216V239" stroke="#596052" stroke-width="2"/>
      <path d="M244 233L250 239L256 233" fill="none" stroke="#596052" stroke-width="2"/>

      <g id="typed-result" transform="translate(0 240)">
        <rect width="500" height="72" rx="14" fill="#182016" stroke="#66813D" stroke-width="2"/>
        <text x="28" y="28" fill="#93A477" font-size="17">TYPED RESULT</text>
        <text x="28" y="56" fill="#F3F0E8" font-size="23">{ port: <tspan fill="#B7E46C">3000</tspan> }</text>
        <text x="466" y="50" text-anchor="end" fill="#B7E46C" font-size="18">number</text>
      </g>

      <g id="resolution-rules" transform="translate(0 340)" font-size="18">
        <rect x="0" y="-13" width="8" height="8" fill="#B7E46C"/>
        <text x="22" y="0" fill="#AEB3A8">missing</text>
        <text x="112" y="0" fill="#73796E">uses default</text>

        <rect x="278" y="-13" width="8" height="8" fill="#E7B75D"/>
        <text x="300" y="0" fill="#AEB3A8">invalid</text>
        <text x="385" y="0" fill="#73796E">stops here</text>
      </g>
    </g>
  </g>
</svg>
